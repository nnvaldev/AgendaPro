name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad (Pint, PHPStan, lint, tipos)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Dependencias
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate
          # Rutas tipadas que importa el frontend (no se versionan).
          php artisan wayfinder:generate --with-form

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Lint y formato (Vite+)
        run: npm run check

      - name: Tipos (vue-tsc)
        run: npm run types:check

  terraform:
    name: Terraform (fmt, validate, test)
    runs-on: ubuntu-latest

    # Los tests usan un provider simulado: no hacen falta credenciales de OCI.
    # Terraform corre en su imagen oficial, igual que en desarrollo.
    env:
      TERRAFORM: docker run --rm -v ${{ github.workspace }}/infra/terraform:/tf -w /tf hashicorp/terraform:1.17.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Formato
        run: $TERRAFORM fmt -recursive -check

      - name: Init y validate
        run: |
          $TERRAFORM init -backend=false -input=false
          $TERRAFORM validate

      - name: Tests
        run: $TERRAFORM test

  tests:
    name: Tests (PHP 8.5 + PostgreSQL 18)
    runs-on: ubuntu-latest

    # PostgreSQL real: los tests ejercitan la restricción EXCLUDE contra
    # reservas dobles y el manejo de zonas horarias, que SQLite no soporta.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: sail
      DB_PASSWORD: password

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Dependencias
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      # Los tests de páginas Inertia necesitan el manifest de Vite.
      - name: Build del frontend
        run: npm run build

      - name: Tests
        run: php artisan test
