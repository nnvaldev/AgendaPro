# Producción: app (FrankenPHP con HTTPS automático), worker de colas,
# Scheduler, PostgreSQL y Redis. Variables en .env.production
# (ver .env.production.example).
#
#   docker compose -f compose.prod.yaml --env-file .env.production up -d
#   docker compose -f compose.prod.yaml --env-file .env.production run --rm app php artisan migrate --force

x-app: &app
    image: '${APP_IMAGE:-ghcr.io/nnvaldev/agendapro:latest}'
    build:
        context: .
        target: production
    env_file: .env.production
    restart: unless-stopped
    depends_on:
        postgres:
            condition: service_healthy
        redis:
            condition: service_healthy
    networks:
        - internal

services:
    app:
        <<: *app
        environment:
            # Dominio público: Caddy pide el certificado de Let's Encrypt solo.
            # Con ":80" sirve HTTP sin TLS (útil para probar en local).
            SERVER_NAME: '${SERVER_NAME:-:80}'
        ports:
            - '${HTTP_PORT:-80}:80'
            - '${HTTPS_PORT:-443}:443'
            - '${HTTPS_PORT:-443}:443/udp'
        volumes:
            - caddy-data:/data/caddy
            - caddy-config:/config/caddy

    queue:
        <<: *app
        command:
            [
                'php',
                'artisan',
                'queue:work',
                '--tries=3',
                '--backoff=30',
                '--max-time=3600',
            ]
        healthcheck:
            disable: true

    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
        healthcheck:
            disable: true

    postgres:
        image: 'postgres:18-alpine'
        restart: unless-stopped
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - internal

    redis:
        image: 'redis:8-alpine'
        restart: unless-stopped
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - internal

# PostgreSQL y Redis no publican puertos: solo la app es accesible desde fuera.
networks:
    internal:

volumes:
    caddy-data:
    caddy-config:
    postgres-data:
    redis-data:
