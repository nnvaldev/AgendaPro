; Ajustes de producción sobre php.ini-production.

expose_php = Off
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
date.timezone = UTC

; El código no cambia dentro del contenedor: OPcache sin revalidar archivos.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
